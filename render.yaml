# Blueprint do Render: cria o backend a partir deste repositório.
# Render > New > Blueprint > escolher o repositório.
services:
  - type: web
    name: na-mochila-api
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # O plano gratuito não tem "pre-deploy", então as migrações rodam na inicialização
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # Só publica depois que o CI (GitHub Actions) passar
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false # connection string da branch production do Neon
      - key: CORS_ORIGINS
        sync: false # URL do frontend na Vercel
